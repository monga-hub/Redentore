<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#222" />
    <!-- Revalidate this page; hashed bundles can cache forever. src/ui/version.ts catches what slips through. -->
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>Redentore Dungeon</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #222; font-family: Georgia, serif; }
      /* no scroll, rubber-band, text selection or double-tap zoom on phones */
      body { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      canvas { display: block; touch-action: none; }
      #zone {
        position: fixed; top: 12%; left: 0; right: 0; text-align: center; pointer-events: none;
        color: #f3e2b0; font-size: 30px; letter-spacing: 1px; text-shadow: 0 2px 4px #000, 0 0 12px #000;
        opacity: 0;
      }
      #zone.show { animation: zone 3.5s ease forwards; }
      @keyframes zone { 0% { opacity: 0 } 15% { opacity: 1 } 70% { opacity: 1 } 100% { opacity: 0 } }
      /* Player frame (src/ui/hud.ts): round portrait, name, health and mana with cur / max. */
      #unit {
        position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(12px + env(safe-area-inset-top));
        display: flex; align-items: center; pointer-events: none;
      }
      #unit .portrait {
        position: relative; z-index: 1; flex: none; width: 62px; height: 62px; border-radius: 50%; overflow: hidden;
        background: #000; border: 2px solid #c9a45c; box-shadow: 0 0 0 2px #000, 0 3px 10px rgba(0,0,0,.7);
      }
      #unit .portrait svg { display: block; width: 100%; height: 100%; }
      #unit .frame {
        width: 190px; margin-left: -16px; padding: 4px 8px 6px 22px;
        background: linear-gradient(rgba(34,25,16,.88), rgba(10,7,5,.88)); border: 1px solid #6b5332; border-left: 0;
        border-radius: 0 6px 6px 0; box-shadow: 0 0 0 1px #000, 0 3px 10px rgba(0,0,0,.6);
      }
      /* Target frame (src/ui/target.ts): beside the player's, hostile red name, health only. */
      #unit #target { width: 150px; margin-left: 10px; padding: 4px 8px 6px; border-left: 1px solid #6b5332; border-radius: 6px; }
      #unit #target[hidden] { display: none; }
      #unit #target .name { color: #ff7a5c; }
      #unit .name { color: #f3e2b0; font: bold 13px/16px Georgia, serif; text-shadow: 0 1px 2px #000; }
      .res {
        position: relative; height: 14px; margin-top: 3px; overflow: hidden; border-radius: 2px;
        background: #120a08; border: 1px solid #000; box-shadow: inset 0 1px 4px #000, 0 0 0 1px rgba(201,164,92,.35);
      }
      .res.mp { height: 12px; }
      .res i { position: absolute; inset: 0 auto 0 0; width: 100%; }
      .res .lag { background: #f6e7b0; opacity: .75; transition: width .5s ease-in .35s; }
      .res.mp .lag { background: #bfe0ff; }
      .res.hp .fill { background: linear-gradient(#ff6a5a, #c0170e 55%, #7a0a05); }
      .res.mp .fill { background: linear-gradient(#6ab4ff, #1a5ad0 55%, #0b2f7a); }
      .res::after { content: ''; position: absolute; inset: 0 0 50% 0; background: linear-gradient(rgba(255,255,255,.22), transparent); }
      .res span {
        position: absolute; inset: 0; z-index: 1; text-align: center; color: #fff; font: bold 10px/14px system-ui, sans-serif;
        text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      }
      .res.mp span { line-height: 12px; }
      .res.hp.low .fill { animation: lowhp .7s ease-in-out infinite alternate; }
      /* Experience (src/player/levels.ts): a thin violet bar under mana, the level on a badge at the portrait's foot. */
      .res.xp { height: 5px; margin-top: 3px; }
      .res.xp .fill { background: linear-gradient(#e2b8ff, #9a4ae0 55%, #4a1080); }
      .res.xp .lag { background: #f3e2ff; }
      .res.xp span { display: none; }
      #unit .lv {
        position: absolute; left: 42px; top: 44px; z-index: 2; min-width: 24px; height: 24px; padding: 0 3px; box-sizing: border-box; border-radius: 12px;
        background: radial-gradient(#4a3418, #120a04); border: 2px solid #c9a45c; box-shadow: 0 0 0 1px #000, 0 2px 6px #000;
        color: #ffd75e; font: bold 12px/20px Georgia, serif; text-align: center; text-shadow: 0 1px 2px #000;
      }
      #unit .lv.up { animation: lvup 1.2s ease-out; }
      @keyframes lvup { 0%, 40% { transform: scale(1.6); box-shadow: 0 0 0 1px #000, 0 0 18px 6px rgba(255,200,90,.9); } }
      @keyframes lowhp { to { filter: brightness(1.7) } }

      /* Minimap (src/ui/minimap.ts): round chart in a bronze ring, top right, zone name on a plate
         above, N on the rim, zoom buttons below right, big-map button below left. The column right of it stays free for the menu
         and fullscreen buttons; narrow screens drop it under the player frame. */
      #minimap {
        --m: 150px;
        position: fixed; right: calc(60px + env(safe-area-inset-right)); top: calc(30px + env(safe-area-inset-top));
        width: var(--m); height: var(--m); pointer-events: none;
      }
      #minimap canvas {
        display: block; width: 100%; height: 100%; border-radius: 50%; background: #16303e;
        box-shadow: 0 0 0 3px #1a120a, 0 0 0 5px #c9a45c, 0 0 0 7px #3b2a16, 0 0 0 8px #000, 0 4px 14px 8px rgba(0,0,0,.6);
      }
      #minimap .name {
        position: absolute; right: -6px; bottom: calc(100% + 9px); /* long names grow leftwards, clear of the button column */
        min-width: calc(100% + 12px); max-width: 230%; padding: 2px 10px; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        text-align: center; color: #ffd200; font: bold 12px/16px Georgia, serif; text-shadow: 0 1px 2px #000;
        background: linear-gradient(rgba(34,25,16,.92), rgba(10,7,5,.92)); border: 1px solid #6b5332; border-radius: 4px; box-shadow: 0 0 0 1px #000;
      }
      #minimap .name:empty { visibility: hidden; }
      #minimap .north {
        position: absolute; left: 50%; top: -8px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%;
        background: radial-gradient(#3b2a16, #120d09); border: 1px solid #c9a45c; box-shadow: 0 0 0 1px #000;
        color: #f3e2b0; font: bold 10px/16px Georgia, serif; text-align: center; text-shadow: 0 1px 1px #000;
      }
      #minimap button {
        position: absolute; width: 22px; height: 22px; padding: 0; border-radius: 50%; cursor: pointer; pointer-events: auto;
        background: radial-gradient(circle at 40% 35%, #4a3a26, #120d09); border: 1px solid #c9a45c; box-shadow: 0 0 0 1px #000, 0 2px 4px #000;
        color: #f3e2b0; font: bold 15px/18px system-ui, sans-serif; text-shadow: 0 1px 1px #000;
      }
      #minimap button:active { filter: brightness(1.4); }
      #minimap .zin { right: -6px; bottom: 16px; }
      #minimap .zout { right: 16px; bottom: -6px; }
      #minimap .wmap { left: -6px; bottom: 16px; width: 26px; height: 26px; }
      #minimap .wmap svg { display: block; width: 62%; height: 62%; margin: auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
      body.touch #minimap { --m: calc(150px * var(--k)); }
      @media (max-width: 720px) { #minimap { top: calc(26px + 80px * var(--k, 1) + env(safe-area-inset-top)); } }

      /* Touch controls (src/ui/touch.ts): only on touch devices. The bottom centre is
         left free for the ability bar. */
      #stick, #jump, #fullscreen { display: none; }
      body.touch #unit { transform: scale(var(--k)); transform-origin: 0 0; }
      body.touch #stick, body.touch #jump, body.touch #fullscreen { display: block; }
      #stick {
        position: fixed; width: calc(120px * var(--k)); height: calc(120px * var(--k)); transform: translate(-50%, -50%); pointer-events: none;
        left: calc(96px * var(--k) + env(safe-area-inset-left)); top: calc(100% - 96px * var(--k) - env(safe-area-inset-bottom));
        border-radius: 50%; border: 2px solid rgba(243,226,176,.35);
        background: radial-gradient(circle, rgba(20,14,8,.15) 30%, rgba(20,14,8,.45) 100%);
        box-shadow: 0 0 12px rgba(0,0,0,.5), inset 0 0 18px rgba(0,0,0,.6);
        opacity: .6; transition: opacity .2s;
      }
      #stick.active { opacity: 1; }
      #knob {
        position: absolute; left: 50%; top: 50%; width: 43%; height: 43%; margin: -21.5% 0 0 -21.5%; border-radius: 50%;
        border: 2px solid rgba(243,226,176,.8); background: radial-gradient(circle at 40% 35%, rgba(243,226,176,.55), rgba(110,80,40,.6));
        box-shadow: 0 2px 6px rgba(0,0,0,.6);
      }
      .touch-btn {
        position: fixed; border-radius: 50%; padding: 0; color: #f3e2b0; touch-action: none;
        border: 2px solid rgba(243,226,176,.55); background: rgba(20,14,8,.5);
        box-shadow: 0 0 12px rgba(0,0,0,.5), inset 0 0 14px rgba(0,0,0,.6); text-shadow: 0 1px 3px #000;
      }
      .touch-btn svg { display: block; width: 55%; height: 55%; margin: auto; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      #jump { background: radial-gradient(circle at 40% 35%, #4a3a26, #120d09); }
      #jump.down { background: rgba(110,80,40,.9); transform: scale(.94); }
      #fullscreen { right: calc(12px + env(safe-area-inset-right)); top: calc(12px + env(safe-area-inset-top)); width: 36px; height: 36px; opacity: .75; }

      /* Action bar: WoW-style buttons, bronze frame, conic cooldown sweep on --p. */
      .actionbar {
        --s: min(46px, calc((100vw - 24px) / 12 - 4px));
        position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        user-select: none; -webkit-user-select: none; touch-action: none;
      }
      .actionbar .bar {
        display: grid; grid-template-columns: repeat(12, var(--s)); gap: 4px; padding: 5px;
        background: linear-gradient(#2a2118, #120d09); border: 1px solid #6b5332; border-radius: 4px;
        box-shadow: 0 0 0 1px #000, 0 4px 14px rgba(0,0,0,.7), inset 0 1px 0 rgba(243,226,176,.15);
      }
      .slot {
        position: relative; width: var(--s); height: var(--s); padding: 0; overflow: hidden; cursor: pointer;
        background: #0b0907; border: 1px solid #000; border-radius: 3px; outline: none;
        box-shadow: inset 0 0 0 1px #8a6d3e, inset 0 0 6px #000; -webkit-tap-highlight-color: transparent;
      }
      .slot.empty { cursor: default; background: radial-gradient(#1c1610, #080605); }
      .slot .icon, .slot .icon svg { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); display: block; }
      .slot .sweep {
        position: absolute; inset: 2px; pointer-events: none;
        background: conic-gradient(rgba(0,0,0,.72) var(--p, 0%), transparent 0);
      }
      .slot::after { /* bevel + gloss over the icon */
        content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 2px;
        box-shadow: inset 0 0 0 2px rgba(0,0,0,.6), inset 0 0 0 3px rgba(212,175,95,.25);
        background: linear-gradient(rgba(255,255,255,.12), transparent 45%);
      }
      .slot .key {
        position: absolute; top: 1px; right: 3px; font: bold 11px/1 system-ui, sans-serif; color: #e8e8e8;
        text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      }
      .slot .cd {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font: bold calc(var(--s) * .38)/1 system-ui, sans-serif; color: #fff4c8; pointer-events: none;
        text-shadow: 0 0 3px #000, 1px 1px 1px #000;
      }
      .slot.pressed { animation: press .12s; }
      @keyframes press { 0% { filter: brightness(1.8); transform: scale(.94) } 100% { filter: none; transform: none } }
      .slot.ready .icon { animation: ready .5s ease-out; }
      @keyframes ready { 0% { filter: brightness(2.6) } 100% { filter: none } }
      .slot.oom .icon { filter: brightness(.5) sepia(1) hue-rotate(180deg) saturate(2.5); } /* not enough mana */
      .slot.active, .slot.casting { box-shadow: inset 0 0 0 1px #8a6d3e, 0 0 6px 1px #ffd75e; border-color: #ffd75e; }
      .slot.active::after { box-shadow: inset 0 0 0 2px #ffd75e, inset 0 0 10px rgba(255,215,94,.6); animation: proc 1.2s ease-in-out infinite alternate; }
      @keyframes proc { from { opacity: .55 } to { opacity: 1 } }
      /* Charge bar: a half-ring over the main button, filled by stroke-dasharray (actionBar.ts). */
      .slot.main { overflow: visible; }
      .slot.main .icon, .slot.main .sweep { overflow: hidden; border-radius: inherit; }
      .slot .charge { position: absolute; inset: -9px; width: calc(100% + 18px); height: calc(100% + 18px); overflow: visible; pointer-events: none; }
      .slot .charge.off { display: none; }
      .charge path { fill: none; stroke: rgba(0,0,0,.75); stroke-width: 7; stroke-linecap: round; }
      .charge .fill { stroke-width: 4.5; stroke-dasharray: 0 100; transition: stroke-dasharray .25s; }
      .charge.full .fill { filter: drop-shadow(0 0 3px #ff3b2f); animation: proc .6s ease-in-out infinite alternate; }
      .slot.locked .icon { filter: grayscale(1) brightness(.35); }
      .slot.special:not(.locked) { border-color: #ff5a3a; box-shadow: inset 0 0 0 1px #8a6d3e, 0 0 8px 2px #ff5a3a; }
      .slot.special:not(.locked)::after { animation: proc .8s ease-in-out infinite alternate; }
      /* Mouse drag to rearrange the bar (actionBar.ts grab): the picked slot dims, the slot under the cursor glows, the icon follows. */
      .slot.lifted .icon { opacity: .3; }
      .slot.drop { border-color: #f3e2b0 !important; box-shadow: 0 0 0 2px #000, 0 0 12px 3px #f3e2b0 !important; filter: brightness(1.3); }
      .drag-ghost { position: fixed; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; z-index: 50; pointer-events: none;
        border: 1px solid #f3e2b0; border-radius: 4px; overflow: hidden; opacity: .85; box-shadow: 0 0 12px #000; }
      .drag-ghost .icon, .drag-ghost svg { width: 100%; height: 100%; display: block; }
      body.diablo .drag-ghost { border-radius: 50%; }
      body.diablo .drag-ghost .icon { filter: sepia(.8) saturate(3) hue-rotate(-42deg) contrast(1.1); }

      .castbar {
        position: relative; width: min(260px, 70vw); height: 16px; visibility: hidden; opacity: 0;
        background: #0d0b08; border: 1px solid #000; box-shadow: 0 0 0 1px #8a6d3e, 0 2px 8px #000; border-radius: 2px;
        transition: opacity .25s, visibility .25s;
      }
      .castbar.show { visibility: visible; opacity: 1; transition: none; }
      .castbar .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ffe066, #c99a00); }
      .castbar.channel .fill { background: linear-gradient(#7ddf64, #2f8f2a); }
      .castbar.done .fill { background: linear-gradient(#8cff7a, #2fa82a); }
      .castbar.fail .fill { background: linear-gradient(#ff5a4a, #9a1a10); }
      .castbar .fill.pushed { animation: pushed .35s ease-out; } /* a hit set the cast back */
      @keyframes pushed { 0% { filter: brightness(1.6) hue-rotate(-45deg) saturate(2.5); box-shadow: 0 0 10px 2px #ff4a2a; } 100% { filter: none; box-shadow: none; } }
      .castbar span { position: absolute; top: 0; font: 11px/16px system-ui, sans-serif; color: #fff; text-shadow: 1px 1px 1px #000; }
      .castbar .name { left: 0; right: 0; text-align: center; }
      .castbar .time { right: 6px; }

      .errors {
        position: fixed; top: 22%; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0;
        color: #ff2a1a; font: bold 17px Georgia, serif; text-shadow: 0 1px 2px #000, 0 0 6px #000;
      }
      .errors.show { animation: zone 2.2s ease forwards; }
      .combat {
        position: fixed; left: 50%; top: 42%; pointer-events: none; white-space: nowrap;
        font: bold 22px Georgia, serif; text-shadow: 0 2px 3px #000, 0 0 8px #000;
        animation: rise 1.6s ease-out forwards;
      }
      .combat.heal { color: #5cff4a; }
      .combat.dmg { color: #ff3b2f; top: 36%; }
      .combat.info { color: #d9b3ff; font-size: 18px; }
      .combat.fury { color: #ff5a3a; font-size: 20px; }
      @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.7) } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.15) } 25% { transform: translate(-50%, -6px) scale(1) } 100% { opacity: 0; transform: translate(-50%, -70px) } }

      .tooltip {
        position: fixed; width: 260px; max-width: calc(100vw - 16px); box-sizing: border-box; padding: 8px 10px; pointer-events: none; display: none;
        background: rgba(8, 10, 24, .94); border: 1px solid #8a8fa8; border-radius: 4px; box-shadow: 0 0 0 1px #000;
        color: #fff; font: 12px/1.4 system-ui, sans-serif;
      }
      .tooltip.show { display: block; }
      .tooltip b { font-size: 14px; }
      .tooltip .row { display: flex; justify-content: space-between; margin: 2px 0 4px; }
      .tooltip p { margin: 0; color: #ffd100; }

      /* Phones: two rows of six, bigger targets for thumbs. */
      @media (max-width: 600px) {
        .actionbar { --s: min(48px, calc((100vw - 24px) / 6 - 5px)); }
        .actionbar .bar { grid-template-columns: repeat(6, var(--s)); }
      }

      /* Touch, Albion-style: the bar dissolves into round buttons fanned around the bottom-right
         corner. Each .ring sets --a (angle, 180deg = left of the corner), --r (radius) and --d
         (diameter). --k scales every touch control (ring, stick, player frame) together: tune it here,
         smaller on short or portrait screens; the smallest ring button stays ~30px. The cast bar
         floats above the character. Hold a ring button to read its tooltip (src/ui/actionBar.ts). */
      body.touch { --k: .72; }
      @media (max-height: 340px), (orientation: portrait) { body.touch { --k: .62; } }
      body:is(.touch, .diablo) .actionbar { transform: none; left: 0; right: 0; bottom: auto; top: 62%; pointer-events: none; }
      body:is(.touch, .diablo) .actionbar .bar { display: contents; }
      body:is(.touch, .diablo) .slot:not(.ring), body.touch .slot .key { display: none; }
      body:is(.touch, .diablo) .ring {
        --cx: 74px; --cy: 70px; /* centre of the big button, from the right/bottom edges */
        --s: calc(var(--d) * var(--k));
        position: fixed; width: var(--s); height: var(--s); pointer-events: auto;
        right: calc(env(safe-area-inset-right) + (var(--cx) - cos(var(--a)) * var(--r) - var(--d) / 2) * var(--k));
        bottom: calc(env(safe-area-inset-bottom) + (var(--cy) + sin(var(--a)) * var(--r) - var(--d) / 2) * var(--k));
        border-radius: 50%; border: 2px solid #b8955a;
        box-shadow: 0 0 0 2px #000, 0 3px 10px rgba(0,0,0,.7), inset 0 0 8px #000;
      }
      body:is(.touch, .diablo) .slot.ring::after { border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.6), inset 0 0 0 4px rgba(212,175,95,.3); }
      body:is(.touch, .diablo) .slot.ring.active, body:is(.touch, .diablo) .slot.ring.casting { border-color: #ffd75e; box-shadow: 0 0 0 2px #000, 0 0 12px 2px #ffd75e; }
      body:is(.touch, .diablo) .slot.ring.special:not(.locked) { border-color: #ff5a3a; box-shadow: 0 0 0 2px #000, 0 0 12px 2px #ff5a3a; }
      body:is(.touch, .diablo) .slot.ring.down { border-color: #f3e2b0; filter: brightness(1.25); }
      body.diablo:not(.touch) { --k: .9; } /* Stile Diablo on desktop: the same fan, mouse-sized */
      body.touch .tooltip { width: 230px; font-size: 11px; }
      body.touch .tooltip b { font-size: 13px; }


      /* Stile Diablo (src/core/style.ts): Diablo Immortal's HUD. Portrait and a blood-red health bar
         top left, the skill fan bottom right (desktop too), menu and map top right; dark iron frames
         instead of WoW's gold. */
      body.diablo #zone { font: 600 24px Georgia, serif; text-transform: uppercase; letter-spacing: 5px; color: #e9d6b0;
        text-shadow: 0 0 10px #000, 0 2px 3px #000, 0 0 22px rgba(170,30,10,.6); }
      body.diablo #unit .portrait { width: 64px; height: 64px; border: 3px solid #1d1a17;
        box-shadow: 0 0 0 2px #77705f, 0 0 0 4px #0a0908, 0 0 16px rgba(170,25,12,.55), inset 0 0 14px #000;
        background: radial-gradient(circle at 50% 35%, #3a1a14, #050303); }
      body.diablo #unit .frame { width: 196px; margin-left: -12px; padding: 2px 8px 4px 18px; background: linear-gradient(90deg, rgba(0,0,0,.55), transparent);
        border: 0; border-radius: 0; box-shadow: none; }
      body.diablo #unit .name { font: bold 12px/15px Georgia, serif; text-transform: uppercase; letter-spacing: 1.5px; color: #d9ccb4; }
      body.diablo #unit #target { width: 160px; margin-left: 14px; background: linear-gradient(90deg, rgba(0,0,0,.6), rgba(0,0,0,.2)); }
      body.diablo #unit #target .name { color: #ff6a4a; }
      body.diablo .res { border-radius: 1px; background: #0b0504; border: 1px solid #000;
        box-shadow: 0 0 0 1px #5d574e, 0 0 0 2px #000, inset 0 2px 6px #000; }
      body.diablo .res.hp { height: 15px; }
      body.diablo .res.hp .fill { background: linear-gradient(#e2361f, #a10f07 50%, #4c0402); }
      body.diablo .res.mp { height: 6px; margin-top: 5px; }
      body.diablo .res.mp span { display: none; }
      body.diablo .res.mp .fill { background: linear-gradient(#5a9cff, #1440b0); }
      body.diablo .res.xp { height: 4px; margin-top: 4px; }
      body.diablo .res.xp .fill { background: linear-gradient(#ffd27a, #b07a10); }
      body.diablo #unit .lv { left: 46px; top: 48px; border-radius: 2px; border-color: #77705f; background: radial-gradient(#2b2520, #0b0908); color: #ff8a5a; }
      body.diablo .res .lag { background: #ffe0b8; }
      body.diablo .res span { line-height: 15px; }
      body.diablo .ring { border: 2px solid #15120f; background: radial-gradient(circle at 50% 40%, #2b1712, #070404);
        box-shadow: 0 0 0 2px #6f685d, 0 0 0 3px #000, 0 4px 12px rgba(0,0,0,.85), inset 0 0 10px #000; }
      body.diablo .slot.ring.main { box-shadow: 0 0 0 3px #8b8173, 0 0 0 5px #000, 0 0 20px rgba(210,45,20,.5), inset 0 0 14px #000; }
      body.diablo .slot.ring::after { border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.75), inset 0 0 14px rgba(170,30,10,.35);
        background: radial-gradient(circle at 50% 28%, rgba(255,235,210,.14), transparent 58%); }
      body.diablo .slot .icon { filter: sepia(.8) saturate(3) hue-rotate(-42deg) contrast(1.1); } /* Diablo Immortal's ember-red skill art */
      body.diablo .slot.oom .icon { filter: brightness(.5) sepia(1) hue-rotate(180deg) saturate(2.5); }
      body.diablo .slot.locked .icon { filter: grayscale(1) brightness(.35); }
      body.diablo .slot.ring.active, body.diablo .slot.ring.casting { border-color: #ff9a3a; box-shadow: 0 0 0 2px #000, 0 0 14px 3px #ff7a2a; }
      body.diablo .slot.ring.special:not(.locked) { border-color: #ff3a1a; box-shadow: 0 0 0 2px #000, 0 0 16px 3px #ff3a1a; }
      body.diablo:not(.touch) .slot .key { top: auto; bottom: 10%; right: 50%; transform: translateX(50%); font-size: 10px; color: #d9ccb4; }
      body.diablo #jump { background: radial-gradient(circle at 50% 40%, #2b1712, #070404); border-color: #6f685d; }
      body.diablo #minimap canvas { box-shadow: 0 0 0 3px #0a0908, 0 0 0 5px #6f685d, 0 0 0 7px #24201c, 0 0 0 8px #000, 0 4px 14px 8px rgba(0,0,0,.65); }
      body.diablo #minimap .name, body.diablo #update { color: #e9d6b0; background: linear-gradient(rgba(30,26,22,.94), rgba(6,5,4,.94)); border-color: #5d574e; }
      body.diablo #minimap button, body.diablo #minimap .north { background: radial-gradient(circle at 40% 35%, #3a3530, #0a0908); border-color: #77705f; color: #e9d6b0; }
      body.diablo #menu-btn { background: radial-gradient(circle at 40% 35%, #3a3530, #0a0908); border-color: #77705f; color: #e9d6b0; }
      body.diablo .castbar { box-shadow: 0 0 0 1px #6f685d, 0 2px 8px #000; }
      body.diablo .castbar .fill { background: linear-gradient(#ff9a3a, #a8300c); }

      /* Damage numbers over the enemies (src/fx/diabloFx.ts, Stile Diablo): placed by transform each frame, popped by scale. */
      #dmg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      #dmg span {
        position: absolute; left: 0; top: 0; translate: -50% -100%; white-space: nowrap; will-change: transform;
        font: bold 19px Georgia, serif; color: #fff1dc; text-shadow: 0 0 3px #000, 0 2px 2px #000, 0 0 10px rgba(0,0,0,.8);
        animation: dmgpop .95s ease-out forwards;
      }
      #dmg span.big { color: #ffb43a; font-size: 29px; text-shadow: 0 0 4px #000, 0 2px 3px #000, 0 0 14px rgba(255,90,10,.75); }
      #dmg span.dot { color: #d2ff9a; font-size: 14px; }
      @keyframes dmgpop { 0% { scale: .4; opacity: 0 } 12% { scale: 1.35; opacity: 1 } 28% { scale: 1 } 72% { opacity: 1 } 100% { scale: .9; opacity: 0 } }

      /* Build id and new-version prompt (src/ui/version.ts). */
      #version {
        position: fixed; left: calc(4px + env(safe-area-inset-left)); bottom: calc(2px + env(safe-area-inset-bottom));
        pointer-events: none; color: #f3e2b0; opacity: .35; font: 9px/1 system-ui, sans-serif; text-shadow: 0 1px 1px #000;
      }
      #update {
        position: fixed; z-index: 10; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; white-space: nowrap;
        background: linear-gradient(rgba(34,25,16,.95), rgba(10,7,5,.95)); border: 1px solid #c9a45c; border-radius: 6px;
        box-shadow: 0 0 0 1px #000, 0 4px 14px rgba(0,0,0,.7); color: #f3e2b0; font: 14px Georgia, serif;
      }
      #update button {
        padding: 5px 12px; cursor: pointer; color: #120d09; font: bold 13px Georgia, serif;
        background: linear-gradient(#f3e2b0, #c9a45c); border: 1px solid #000; border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="zone"></div>
    <div id="unit">
      <div class="portrait"></div><b class="lv" title="Livello">1</b>
      <div class="frame"><div class="name">Risorto</div><div class="res hp"></div><div class="res mp"></div><div class="res xp" title="Esperienza"></div></div>

      <b class="north">N</b>

    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
