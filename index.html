<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#222" />
    <title>Redentore Dungeon</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #222; font-family: Georgia, serif; }
      /* no scroll, rubber-band, text selection or double-tap zoom on phones */
      body { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      canvas { display: block; touch-action: none; }
      #zone {
        position: fixed; top: 12%; left: 0; right: 0; text-align: center; pointer-events: none;
        color: #f3e2b0; font-size: 30px; letter-spacing: 1px; text-shadow: 0 2px 4px #000, 0 0 12px #000;
        opacity: 0;
      }
      #zone.show { animation: zone 3.5s ease forwards; }
      @keyframes zone { 0% { opacity: 0 } 15% { opacity: 1 } 70% { opacity: 1 } 100% { opacity: 0 } }
      #help {
        position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; pointer-events: none;
        color: #eee; font: 13px/1.5 system-ui, sans-serif; background: rgba(0,0,0,.45); border-radius: 6px;
      }
      #help .touch { display: none; }

      /* Touch controls (src/ui/touch.ts): only on touch devices. The bottom centre is
         left free for the ability bar. */
      #stick, #jump, #fullscreen { display: none; }
      body.touch #help { left: calc(10px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); bottom: auto; font-size: 11px; padding: 5px 9px; }
      body.touch #help .desk { display: none; }
      body.touch #help .touch { display: inline; }
      body.touch #stick, body.touch #jump, body.touch #fullscreen { display: block; }
      #stick {
        position: fixed; width: 120px; height: 120px; transform: translate(-50%, -50%); pointer-events: none;
        left: calc(96px + env(safe-area-inset-left)); top: calc(100% - 96px - env(safe-area-inset-bottom));
        border-radius: 50%; border: 2px solid rgba(243,226,176,.35);
        background: radial-gradient(circle, rgba(20,14,8,.15) 30%, rgba(20,14,8,.45) 100%);
        box-shadow: 0 0 12px rgba(0,0,0,.5), inset 0 0 18px rgba(0,0,0,.6);
        opacity: .45; transition: opacity .2s;
      }
      #stick.active { opacity: 1; }
      #knob {
        position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
        border: 2px solid rgba(243,226,176,.8); background: radial-gradient(circle at 40% 35%, rgba(243,226,176,.55), rgba(110,80,40,.6));
        box-shadow: 0 2px 6px rgba(0,0,0,.6);
      }
      .touch-btn {
        position: fixed; border-radius: 50%; padding: 0; color: #f3e2b0; touch-action: none;
        border: 2px solid rgba(243,226,176,.55); background: rgba(20,14,8,.5);
        box-shadow: 0 0 12px rgba(0,0,0,.5), inset 0 0 14px rgba(0,0,0,.6); text-shadow: 0 1px 3px #000;
      }
      .touch-btn svg { display: block; margin: auto; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      #jump { right: calc(28px + env(safe-area-inset-right)); bottom: calc(36px + env(safe-area-inset-bottom)); width: 78px; height: 78px; }
      #jump.down { background: rgba(110,80,40,.7); transform: scale(.94); }
      #fullscreen { right: calc(12px + env(safe-area-inset-right)); top: calc(12px + env(safe-area-inset-top)); width: 40px; height: 40px; opacity: .75; }
    </style>
  </head>
  <body>
    <div id="zone"></div>
    <div id="help">
      <span class="desk">
        <b>WASD</b> muovi · <b>Shift</b> cammina · <b>Spazio</b> salta · <b>Q/E</b> ruota camera<br />
        <b>Trascina sx</b> orbita camera · <b>Trascina dx</b> gira personaggio · <b>Rotella</b> zoom · <b>Sx+Dx</b> avanti
      </span>
      <span class="touch"><b>Stick sx</b> muovi · <b>Trascina</b> camera · <b>Pizzica</b> zoom</span>
    </div>
    <div id="stick"><div id="knob"></div></div>
    <button id="jump" class="touch-btn" aria-label="Salta">
      <svg width="34" height="34" viewBox="0 0 24 24"><path d="M5 14l7-7 7 7M5 20l7-7 7 7" /></svg>
    </button>
    <button id="fullscreen" class="touch-btn" aria-label="Schermo intero">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
